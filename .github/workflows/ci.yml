name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 本仓 checkout 到仓名目录（跨仓 ProjectReference 解析到同级 <dep>/ 目录）
      - uses: actions/checkout@v4
        with:
          path: aether-exchange
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # GitHub Packages 私有源凭据（GITHUB_TOKEN 只写进 CI 运行时文件，不入库）。
      # 依赖仓为私有仓时 GITHUB_TOKEN 默认不能跨仓读取——需在 org Settings → Actions →
      # General 开放 accessible repositories，或改用 PAT secret。
      - name: Configure GitHub Packages credentials
        run: >
          dotnet nuget update source github
          --configfile aether-exchange/nuget.config
          --username AetherAxis
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      - name: Build
        run: dotnet build Aether.Exchange.slnx -c Release
        working-directory: aether-exchange

      # 测试同仓自持（2026-10-23 迁入——不引兄弟仓，CI 无须额外 checkout）：
      # 138 例 = 撮合/订单生命周期/会计不变量/费用/风控/认证/持久化/RPC wire。
      - name: Test
        run: dotnet test Aether.Exchange.slnx -c Release --no-build --collect:"XPlat Code Coverage"
        working-directory: aether-exchange

      # 覆盖率留档（撮合/会计不变量是回归重灾区——有基线才看得出被新改动啃掉多少）
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-aether-exchange
          path: aether-exchange/tests/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
